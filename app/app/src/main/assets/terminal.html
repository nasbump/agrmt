<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #101014;
    overflow: hidden;
    /* 关闭 Android WebView 的文字自动放大，否则字号会被强制拉大而单元格不变，导致字符重叠。 */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  /* 手势全部由脚本处理：touch-action:none 阻止 WebView 把纵向拖动当原生滚动接管
     （接管后会发 touchcancel，历史就再也滚不动）。 */
  #term {
    width: 100%;
    height: 100%;
    padding: 4px;
    box-sizing: border-box;
    overflow-x: hidden;
    overflow-y: hidden;
    touch-action: none;
  }
  .xterm .xterm-viewport {
    background: #101014 !important;
  }
  /* xterm 默认让 .xterm 的高度等于字符画布高度，容器更高时 viewport 就没有
     可滚动的多余区域，历史输出无法回滚；拉满高度后 viewport 才覆盖整个可见区。 */
  .xterm {
    height: 100%;
  }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script>
(function () {
  // 行高必须大于 1：lineHeight 为 1 时单元格高度等于字高，行与行之间没有留白，
  // 小字号下上下两行会糊在一起。
  var LINE_HEIGHT = 1.2;
  // 低于该字号时文字无法辨认，改为按最小字号渲染并允许横向平移。
  var MIN_FONT_SIZE = 11;
  // 矮屏（键盘弹出）下 24 行按 MIN_FONT_SIZE 装不下时继续缩小；
  // 缩到这个字号仍装不下就保留该字号，改为纵向平移整块画布。
  var MIN_READABLE_FONT_SIZE = 10;
  // 容器高度低于该值时视为布局尚未完成，先按此高度估算字号，避免算出过小的字号。
  var MIN_AVAIL_HEIGHT = 160;
  var MAX_FONT_SIZE = 18;
  // 等宽字体单字符前进宽度与字号之比（无头 chromium 实测）。
  var CHAR_WIDTH_RATIO = 0.6;
  // 单元格总高（字高 × lineHeight）与字号之比：xterm 会把设备像素取整，
  // 实测随字号在 1.59~1.71 之间波动，取上界保证 24 行整屏都不被裁掉。
  var CELL_HEIGHT_RATIO = 1.72;
  // 相邻字符的额外留白（CSS 像素）：小字号下字形墨迹会超出前进宽度，不留白就会相连。
  var LETTER_SPACING_CSS = 1;

  var dpr = window.devicePixelRatio || 1;
  // xterm 的 letterSpacing 以设备像素为单位叠加到单元格宽度上，这里换算成 CSS 像素留白。
  var letterSpacingDevice = Math.max(1, Math.round(LETTER_SPACING_CSS * dpr));

  var term = new Terminal({
    allowProposedApi: true,
    cursorBlink: false,
    convertEol: false,
    fontSize: 14,
    fontFamily: 'monospace',
    lineHeight: LINE_HEIGHT,
    letterSpacing: letterSpacingDevice,
    scrollback: 5000,
    theme: { background: '#101014' }
  });
  term.open(document.getElementById('term'));

  var host = document.getElementById('term');
  var desiredCols = 0;
  var desiredRows = 0;

  // 是否跟随最新输出：用户向上翻看历史或平移画布离开底部时置 false，
  // 回到底部或尺寸变化后恢复 true。
  var followBottom = true;

  // 按容器尺寸挑选字号：宽度不足但高度足够时保留 MIN_FONT_SIZE（多出的列横向平移）；
  // 高度不足 24 行时缩小到 MIN_READABLE_FONT_SIZE 为止，再放不下由画布平移兜底。
  function computeFontSize(availW, availH, cols, rows) {
    var gap = letterSpacingDevice / dpr;
    var byWidth = (availW / cols - gap) / CHAR_WIDTH_RATIO;
    var byHeight = availH / (rows * CELL_HEIGHT_RATIO);
    var fs;
    if (byHeight >= MIN_FONT_SIZE) {
      fs = Math.max(MIN_FONT_SIZE, Math.min(byWidth, byHeight));
    } else {
      fs = Math.max(MIN_READABLE_FONT_SIZE, byHeight);
    }
    return Math.min(MAX_FONT_SIZE, Math.floor(fs * 2) / 2);
  }

  // #term 的纵向溢出必须超过一整行，才值得用平移查看底部行；
  // 少量像素的取整误差不能夺走“翻看历史”的纵向手势。
  function canvasOverflows() {
    var ch = cellHeight();
    var overflow = host.scrollHeight - host.clientHeight;
    return overflow > (ch > 0 ? ch : 24);
  }

  function scrollCanvasToBottom() {
    var max = host.scrollHeight - host.clientHeight;
    if (max > 0 && Math.abs(host.scrollTop - max) > 1) host.scrollTop = max;
  }

  // 单个字符单元格高度，用于把手指位移换算成行数。
  function cellHeight() {
    var screen = term.element && term.element.querySelector('.xterm-screen');
    var rows = term.rows || desiredRows;
    if (!screen || !rows) return 0;
    return screen.clientHeight / rows;
  }

  // 终端是否停在最新输出处。xterm 的缓冲区位置要等滚动事件回调才更新，
  // 手指刚滚动完读到的还是旧值，因此同时检查滚动条位置与缓冲区位置。
  function termAtBottom() {
    var vp = term.element && term.element.querySelector('.xterm-viewport');
    if (vp && vp.scrollTop + vp.clientHeight < vp.scrollHeight - 1) return false;
    var b = term.buffer && term.buffer.active;
    return !b || b.viewportY >= b.baseY;
  }

  // 画布是否停在底部（矮屏平移场景；画布未溢出时视为在底部）。
  function atCanvasBottom() {
    var max = host.scrollHeight - host.clientHeight;
    return max <= 1 || host.scrollTop >= max - 2;
  }

  function syncFollow() {
    followBottom = termAtBottom() && atCanvasBottom();
  }

  // xterm 的滚动区高度依赖 requestAnimationFrame 回调，页面不可见时该回调会被
  // 跳过，历史输出就滚不动；写入后主动同步一次，保证滚动范围立即生效。
  function syncViewport() {
    var vc = term._core && term._core.viewport;
    if (vc && typeof vc.syncScrollArea === 'function') vc.syncScrollArea(true);
  }

  window.agrmtSetSize = function (cols, rows) {
    if (!cols || !rows) return;
    desiredCols = cols;
    desiredRows = rows;
    var availW = Math.max(80, host.clientWidth - 8);
    var availH = Math.max(MIN_AVAIL_HEIGHT, host.clientHeight - 8);
    term.options.fontSize = computeFontSize(availW, availH, cols, rows);
    term.resize(cols, rows);
    // 尺寸变化后画布高度随之改变，重新贴底让光标所在行保持可见。
    followBottom = true;
    requestAnimationFrame(function () {
      term.scrollToBottom();
      scrollCanvasToBottom();
    });
  };

  window.agrmtFit = function () {
    if (desiredCols && desiredRows) {
      window.agrmtSetSize(desiredCols, desiredRows);
    }
  };

  // 直接写入字节流：xterm.js 内部按 UTF-8 跨多次 write 保持解码状态，
  // 分块截断的多字节字符不会乱码。
  window.agrmtWriteB64 = function (b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes, function () {
      syncViewport();
      if (followBottom) {
        // 停在底部时新输出继续跟随；用户正在翻历史则保持位置不动。
        term.scrollToBottom();
        scrollCanvasToBottom();
      }
    });
  };

  window.agrmtReset = function () {
    term.reset();
    followBottom = true;
    if (desiredCols && desiredRows) window.agrmtSetSize(desiredCols, desiredRows);
  };

  // 终端自身产生的按键（含输入法、粘贴）转给 Android 端发送。
  term.onData(function (data) {
    if (!window.AndroidTerm) return;
    try {
      window.AndroidTerm.input(btoa(unescape(encodeURIComponent(data))));
    } catch (e) {}
  });

  // DECCKM 影响方向键序列，值变化时通知 Android 端。
  var lastAppCursor = null;
  function pollModes() {
    var m = term.modes;
    if (m && typeof m.applicationCursorKeysMode === 'boolean') {
      if (m.applicationCursorKeysMode !== lastAppCursor) {
        lastAppCursor = m.applicationCursorKeysMode;
        if (window.AndroidTerm) window.AndroidTerm.cursorKeys(lastAppCursor);
      }
    }
    setTimeout(pollModes, 250);
  }
  setTimeout(pollModes, 250);

  // 全部手势在捕获阶段自行处理，并阻止事件继续传播，
  // 避免同时触发 xterm 内部滚动或 WebView 原生滚动造成双重滚动。
  var pan = { state: 0, x: 0, y: 0, left: 0, lastY: 0 };

  // 把一段纵向位移换算成滚轮事件交给 xterm：
  // 备用屏幕（TUI）由 xterm 转成上下方向键，
  // 应用开启鼠标上报时由 xterm 转成鼠标滚轮事件。
  // 坐标随事件带上，鼠标上报模式下 xterm 才能算出正确的列与行。
  function wheelBy(dy, touch) {
    if (dy === 0) return;
    var el = term.element;
    if (!el) return;
    el.dispatchEvent(new WheelEvent('wheel', {
      deltaY: dy,
      deltaMode: WheelEvent.DOM_DELTA_PIXEL,
      clientX: touch.clientX,
      clientY: touch.clientY,
      screenX: touch.screenX,
      screenY: touch.screenY,
      bubbles: true,
      cancelable: true
    }));
  }

  // 普通缓冲区的历史滚动走 xterm 的 scrollLines 接口：
  // 它会把“用户正在翻历史”记录到内部状态，之后的新输出不再把视图拉回底部；
  // 而合成滚轮事件依赖 viewport 的 scroll 事件才能记录该状态，WebView 的
  // touch-action 场景下并不可靠。落在半行内的位移累计到下一次手势。
  var lineRemainder = 0;
  function scrollLinesBy(dy) {
    var ch = cellHeight();
    if (!ch) return;
    var lines = dy / ch + lineRemainder;
    var whole = lines < 0 ? Math.ceil(lines) : Math.floor(lines);
    lineRemainder = lines - whole;
    if (whole === 0) return;
    term.scrollLines(whole);
    // 同步滚动条位置，不依赖 requestAnimationFrame 回调。
    syncViewport();
  }

  // 普通缓冲区且未开启鼠标上报时才用 scrollLines；其余走滚轮转换。
  function scrollBy(dy, touch) {
    var b = term.buffer && term.buffer.active;
    var mouse = term.modes && term.modes.mouseTrackingMode;
    if (b && b.type === 'normal' && (!mouse || mouse === 'none')) {
      scrollLinesBy(dy);
    } else {
      wheelBy(dy, touch);
    }
  }

  host.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) {
      pan.state = 0;
      return;
    }
    pan.x = e.touches[0].clientX;
    pan.y = e.touches[0].clientY;
    pan.lastY = e.touches[0].clientY;
    pan.left = host.scrollLeft;
    pan.state = 1;
  }, { capture: true, passive: true });

  host.addEventListener('touchmove', function (e) {
    if (pan.state === 0 || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - pan.x;
    var dy = e.touches[0].clientY - pan.y;
    if (pan.state === 1) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      pan.state = Math.abs(dx) > Math.abs(dy) ? 2 : 3;
    }
    e.preventDefault();
    e.stopPropagation();
    if (pan.state === 2) {
      // 横向平移被遮住的右侧内容。
      host.scrollLeft = pan.left - dx;
      return;
    }
    if (canvasOverflows()) {
      // 矮屏：画布高于一行，纵向平移整块画布查看底部行。
      // 画布贴到一端后仍有位移，就继续交给 xterm 翻历史，
      // 否则键盘弹出时历史输出完全够不着。
      var maxY = host.scrollHeight - host.clientHeight;
      var move = e.touches[0].clientY - pan.lastY;
      var before = host.scrollTop;
      host.scrollTop = Math.max(0, Math.min(maxY, before - move));
      var leftover = -(move + before - host.scrollTop);
      if (leftover !== 0) scrollBy(leftover, e.touches[0]);
    } else {
      // 正常场景：手指上移看后面的内容，与滚轮向下滚动方向一致。
      scrollBy(pan.lastY - e.touches[0].clientY, e.touches[0]);
    }
    pan.lastY = e.touches[0].clientY;
    syncFollow();
  }, { capture: true, passive: false });

  function endPan() {
    pan.state = 0;
    syncFollow();
  }
  host.addEventListener('touchend', endPan, { capture: true, passive: true });
  host.addEventListener('touchcancel', endPan, { capture: true, passive: true });

  // 矮屏平移画布后，根据画布是否贴底恢复“跟随最新输出”。
  host.addEventListener('scroll', function () {
    followBottom = termAtBottom() && atCanvasBottom();
  }, { capture: true, passive: true });

  window.addEventListener('resize', window.agrmtFit);
  if (window.AndroidTerm && window.AndroidTerm.ready) window.AndroidTerm.ready();
})();
</script>
</body>
</html>
